<script>
const defaultStore = {
activeProjectId: "p1",
projects: [
{
id: "p1",
title: "霧の館密室殺人事件",
tagline: "嵐の孤島で起こる不可能な連続殺人",
synopsis: "外界と断絶された洋館。深夜0時に鳴り響く鐘の音と共に第一の犠牲者が発見される。",
color: "#6366f1",
icon: "🏰",
currentSectionId: "sec-1",
sections: [
{ id: "sec-1", name: "1日目", timeSlots: ["08:00", "09:00", "10:00", "11:00", "12:00", "14:00"] },
{ id: "sec-2", name: "2日目", timeSlots: ["朝", "昼", "夕方", "夜", "深夜"] }
],
characters: [
{ id: "char-1", name: "探偵A", color: "#3b82f6", type: "character", image: "" },
{ id: "char-2", name: "助手B", color: "#10b981", type: "character", image: "" },
{ id: "char-3", name: "容疑者C", color: "#ef4444", type: "character", image: "" }
],
cards: [
{ id: "c1", sectionId: "sec-1", charId: "char-1", startTime: "09:00", endTime: "11:00", location: "書斎", publicText: "現場の調査を開始", secretText: "金庫の暗号メモを発見し隠す" },
{ id: "c2", sectionId: "sec-1", charId: "char-2", startTime: "09:00", endTime: "10:00", location: "書斎", publicText: "探偵のアシスタント", secretText: "特に怪しい動きはなし" },
{ id: "c3", sectionId: "sec-1", charId: "char-3", startTime: "09:00", endTime: "09:00", location: "中庭", publicText: "散歩をしていたと証言", secretText: "裏口から倉庫へ移動していた" }
]
}
]
};
function safeGetStore() {
try {
const item = localStorage.getItem("story_all_projects_data");
return item ? JSON.parse(item) : defaultStore;
} catch (e) {
return defaultStore;
}
}
function safeSetStore(val) {
try {
localStorage.setItem("story_all_projects_data", JSON.stringify(val));
} catch (e) {}
}
let db = safeGetStore();
let currentScreen = "projects";
let appMode = "edit";
let viewMode = "pl";
let activeHighlightTime = null;
let activeHighlightLocation = null;
let editingCardId = null;
let editingProjectId = null;
let draggedCardId = null;
const IS_TOUCH_DEVICE = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
function getCurProject() {
return (db.projects && db.projects.find(p => p.id === db.activeProjectId)) || db.projects[0];
}
function saveStore() {
safeSetStore(db);
if (currentScreen === "projects") {
renderProjectsScreen();
} else {
renderTimelineScreen();
}
}
function showScreen(screenName) {
currentScreen = screenName;
document.querySelectorAll(".view-screen").forEach(el => el.classList.remove("active"));
if (screenName === "projects") {
document.getElementById("screen-projects").classList.add("active");
renderProjectsScreen();
} else {
document.getElementById("screen-timeline").classList.add("active");
renderTimelineScreen();
}
}
function goToProjectsScreen() { showScreen("projects"); }
function openProject(projectId) {
db.activeProjectId = projectId;
saveStore();
showScreen("timeline");
}
function renderProjectsScreen() {
const grid = document.getElementById("project-card-grid");
if (!grid) return;
grid.innerHTML = "";
db.projects.forEach(p => {
const card = document.createElement("div");
card.className = "bg-gray-900 border border-gray-800 hover:border-gray-700 rounded-xl p-5 shadow-lg flex flex-col justify-between cursor-pointer transition transform hover:-translate-y-1 relative group";
card.style.borderTop = `4px solid ${p.color || '#6366f1'}`;
card.onclick = () => openProject(p.id);
card.innerHTML = `<div> <div class="flex items-center justify-between mb-3"> <span class="text-3xl bg-gray-950 p-2 rounded-lg border border-gray-800">${p.icon || '📜'}</span> <button type="button" onclick="event.stopPropagation(); deleteProject('${p.id}')" class="text-red-400 hover:text-red-300 px-2 py-1 rounded bg-gray-800 text-[10px]">削除</button> </div> <h3 class="text-base font-bold text-gray-100 group-hover:text-indigo-300 transition mb-1">${p.title}</h3> <p class="text-indigo-400/90 text-xs mb-2 font-medium">${p.tagline || 'キャッチコピー未設定'}</p> <p class="text-gray-400 text-xs line-clamp-2 leading-relaxed">${p.synopsis || 'あらすじ未設定'}</p> </div> <div class="mt-4 pt-3 border-t border-gray-800 flex items-center justify-between text-[11px] text-gray-500"> <span>🔖 セクション: ${p.sections ? p.sections.length : 0}</span> <span>👥 キャラ: ${p.characters ? p.characters.length : 0}</span> <span>🗂️ カード: ${p.cards ? p.cards.length : 0}</span> </div>`;
grid.appendChild(card);
});
}
const TIME_PRESETS = {
hourly: { label: "1時間区切り", sub: "08:00〜18:00", slots: Array.from({length: 11}, (_, i) => String(8 + i).padStart(2, "0") + ":00") },
narrative: { label: "物語区切り", sub: "朝・昼・夕方・夜・深夜", slots: ["朝", "昼", "夕方", "夜", "深夜"] }
};
let selectedTimePreset = "hourly";
function selectTimePreset(key) {
selectedTimePreset = key;
renderPresetButtons();
}
function renderPresetButtons() {
Object.keys(TIME_PRESETS).forEach(key => {
const btn = document.getElementById("preset-" + key);
if (!btn) return;
const active = key === selectedTimePreset;
btn.className = `px-2 py-1.5 rounded border text-[11px] font-medium transition ${active ? "bg-indigo-600 border-indigo-500 text-white" : "bg-gray-800 border-gray-700 text-gray-400 hover:text-gray-200"}`;
btn.innerHTML = `${TIME_PRESETS[key].label}<br><span class="opacity-75 font-normal">${TIME_PRESETS[key].sub}</span>`;
});
}
function openProjectModal() {
document.getElementById("project-title").value = "";
document.getElementById("project-tagline").value = "";
document.getElementById("project-synopsis").value = "";
selectedTimePreset = "hourly";
renderPresetButtons();
document.getElementById("project-modal").style.display = "flex";
}
function closeProjectModal() { document.getElementById("project-modal").style.display = "none"; }
function saveProject() {
const title = document.getElementById("project-title").value.trim();
if (!title) { alert("作品名を入力してください"); return; }
const initialSlots = (TIME_PRESETS[selectedTimePreset] || TIME_PRESETS.hourly).slots;
const newProj = {
id: "p-" + Date.now(),
title,
tagline: document.getElementById("project-tagline").value.trim(),
synopsis: document.getElementById("project-synopsis").value.trim(),
color: document.getElementById("project-color").value,
icon: document.getElementById("project-icon").value || "📜",
currentSectionId: "sec-1",
sections: [{ id: "sec-1", name: "1日目", timeSlots: [...initialSlots] }],
characters: [{ id: "char-1", name: "主人公", color: "#3b82f6" }],
cards: []
};
db.projects.push(newProj);
db.activeProjectId = newProj.id;
closeProjectModal();
saveStore();
showScreen("timeline");
}
function deleteProject(id) {
if (db.projects.length <= 1) { alert("最後の1作品は削除できません"); return; }
if (!confirm("この作品を削除しますか？")) return;

parsed.sections = [{ id: "sec-1", name: "1日目", timeSlots: ["08:00", "10:00", "12:00", "14:00"] }];
}
if (!parsed.currentSectionId || !parsed.sections.find(s => s.id === parsed.currentSectionId)) {
parsed.currentSectionId = parsed.sections[0].id;
}
if (!Array.isArray(parsed.characters)) parsed.characters = [];
if (!Array.isArray(parsed.cards)) parsed.cards = [];
if (!parsed.title) parsed.title = "無題の作品";
db.projects.push(parsed);
db.activeProjectId = parsed.id;
} else {
throw new Error("このJSONには projects / sections / characters / cards のいずれも見つかりませんでした。実際のキー: " + (parsed && typeof parsed === "object" ? Object.keys(parsed).join(", ") : typeof parsed));
}
saveStore();
alert("読み込み完了！");
} catch (err) {
alert("読み込み失敗：ファイルの形式が正しくありません\n詳細: " + err.message);
} finally {
e.target.value = "";
}
};
reader.onerror = () => alert("読み込み失敗：ファイルを読み取れませんでした");
reader.readAsText(file);
}
function saveCurrentProjectFile() {
const curProj = getCurProject();
const blob = new Blob([JSON.stringify(curProj, null, 2)], { type: "application/json" });
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = `${curProj.title}.json`;
a.click();
}
window.addEventListener("DOMContentLoaded", () => {
showScreen("projects");
});
</script>
